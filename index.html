<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三人掼蛋</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🃏</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

    <section id="login-screen" class="screen">
        <h1>三人掼蛋</h1>
        <p class="subtitle">一家三口，连同一个WiFi就能玩</p>
        <div class="panel narrow">
            <input type="text" id="player-name" placeholder="输入你的名字" maxlength="12" autocomplete="off">
            <button id="login-btn" class="btn btn-primary btn-block">进入游戏</button>
        </div>
    </section>

    <section id="lobby-screen" class="screen hidden">
        <h1>游戏大厅</h1>
        <p class="subtitle">你好，<span id="lobby-player-name"></span></p>
        <div class="panel narrow">
            <button id="create-room-btn" class="btn btn-primary btn-block">创建房间</button>
            <div class="divider"><span>或</span></div>
            <div class="join-row">
                <input type="text" id="room-id-input" placeholder="房间号" maxlength="4" autocomplete="off">
                <button id="join-room-btn" class="btn btn-secondary">加入</button>
            </div>
        </div>
        <div class="panel">
            <h3>当前房间</h3>
            <ul id="rooms" class="room-list"></ul>
            <p id="no-rooms" class="hint">还没有人创建房间</p>
        </div>
    </section>

    <section id="game-screen" class="screen hidden">
        <header class="game-header">
            <div class="header-left">
                <span class="room-tag">房间 <b id="room-code"></b></span>
                <span class="level-tag">当前级牌 <b id="level-badge">2</b></span>
            </div>
            <button id="leave-room-btn" class="btn btn-ghost btn-sm">退出</button>
        </header>

        <div id="status-bar" class="status-bar">等待玩家加入…</div>

        <div class="opponents">
            <div class="opponent" id="opp-left">
                <div class="opp-name">等待中…</div>
                <div class="opp-meta"><span class="opp-count">0</span> 张</div>
                <div class="opp-tag"></div>
            </div>
            <div class="opponent" id="opp-right">
                <div class="opp-name">等待中…</div>
                <div class="opp-meta"><span class="opp-count">0</span> 张</div>
                <div class="opp-tag"></div>
            </div>
        </div>

        <div class="table-area">
            <div id="table-label" class="table-label"></div>
            <div id="played-cards" class="played-cards"></div>
            <div id="table-hint" class="table-hint"></div>
        </div>

        <div id="toast" class="toast hidden"></div>

        <div class="my-area">
            <div class="my-header">
                <span id="my-name-label">我</span>
                <span class="my-count"><b id="my-count">0</b> 张</span>
            </div>
            <div id="my-cards" class="my-cards"></div>
        </div>

        <div class="action-bar">
            <button id="start-game-btn" class="btn btn-primary hidden">开始游戏</button>
            <button id="next-round-btn" class="btn btn-primary hidden">再来一局</button>
            <button id="pass-btn" class="btn btn-secondary hidden" disabled>不要</button>
            <button id="play-btn" class="btn btn-primary hidden" disabled>出牌</button>
            <button id="hint-btn" class="btn btn-ghost hidden">提示</button>
        </div>
    </section>

    <div id="result-modal" class="modal hidden">
        <div class="modal-box">
            <h2 id="result-title">本局结束</h2>
            <ol id="result-order" class="result-order"></ol>
            <p id="result-level" class="result-level"></p>
            <button id="result-close" class="btn btn-primary btn-block">知道了</button>
        </div>
    </div>

</div>
<script src="cardLogic.js"></script>
<script src="game.js"></script>
</body>
</html>
