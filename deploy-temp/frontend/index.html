<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三人惯蛋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="login-screen" class="screen">
            <h1>三人惯蛋</h1>
            <div class="login-form">
                <input type="text" id="player-name" placeholder="请输入你的名字" maxlength="10">
                <button id="login-btn">进入游戏</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen hidden">
            <h1>游戏大厅</h1>
            <div class="lobby-container">
                <div class="room-actions">
                    <button id="create-room-btn">创建房间</button>
                    <div class="join-room">
                        <input type="text" id="room-id-input" placeholder="输入房间号">
                        <button id="join-room-btn">加入房间</button>
                    </div>
                </div>
                <div id="room-list">
                    <h3>可用房间</h3>
                    <ul id="rooms"></ul>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <div class="room-info">
                    <span id="current-room-id">房间号: </span>
                    <button id="leave-room-btn">退出房间</button>
                </div>
                <div id="game-status">等待玩家加入...</div>
            </div>

            <div class="game-table">
                <div class="player-area top-player">
                    <div class="player-info">
                        <span id="player2-name">玩家2</span>
                        <span id="player2-cards" class="card-count">0张</span>
                    </div>
                    <div id="player2-cards-area" class="cards-area"></div>
                </div>

                <div class="player-area left-player">
                    <div class="player-info">
                        <span id="player1-name">玩家1</span>
                        <span id="player1-cards" class="card-count">0张</span>
                    </div>
                    <div id="player1-cards-area" class="cards-area"></div>
                </div>

                <div class="play-area">
                    <div id="played-cards" class="played-cards"></div>
                    <div id="game-message" class="game-message"></div>
                </div>

                <div class="player-area right-player">
                    <div class="player-info">
                        <span id="player3-name">玩家3</span>
                        <span id="player3-cards" class="card-count">0张</span>
                    </div>
                    <div id="player3-cards-area" class="cards-area"></div>
                </div>

                <div class="player-area bottom-player">
                    <div class="player-info">
                        <span id="current-player-name">我</span>
                        <span id="my-cards" class="card-count">0张</span>
                    </div>
                    <div id="my-cards-area" class="cards-area"></div>
                    <div class="action-buttons">
                        <button id="play-cards-btn" class="btn-primary" disabled>出牌</button>
                        <button id="pass-btn" class="btn-secondary" disabled>不出</button>
                        <button id="sort-cards-btn" class="btn-secondary">理牌</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
