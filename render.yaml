# Render 蓝图：在 Render 上选 "New > Blueprint"，连上这个仓库即可
services:
  - type: web
    name: guandan-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # 家庭密码：部署后在 Render 后台填一个，只有知道的人能进
      - key: GAME_PASSWORD
        sync: false
